<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đặt lịch sửa chữa</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="navbar">
      <div class="logo"><i class="bi bi-house-fill"></i></div>
      <ul class="nav-menu">
        <li><a href="/index.html">Trang Chủ</a></li>
        <li><a href="/booking.html">Đặt dịch vụ</a></li>
        <li><a href="/admin.html">Khách hàng</a></li>
        <li><a href="/contact.html">Liên hệ</a></li>
      </ul>
      <div class="hotline">
        <span>Hotline:</span> <strong>0942525442</strong>
      </div>
    </div>

    <section class="form-section">
      <h2>Đặt lịch sửa chữa</h2>
      <form id="bookingForm">
        <label for="service">Chọn dịch vụ:</label>
        <select id="service" required>
          <option value="">-- Chọn dịch vụ --</option>
          <option>Sửa điện</option>
          <option>Sửa ống nước</option>
          <option>Sửa nhà cửa</option>
        </select>

        <label for="date">Chọn ngày:</label>
        <input type="date" id="date" required />

        <label for="time">Chọn giờ:</label>
        <input type="time" id="time" required />

        <label for="city">Chọn tỉnh/thành phố:</label>
        <select id="city" required></select>

        <label for="note">Ghi chú thêm:</label>
        <textarea
          id="note"
          rows="4"
          placeholder="Ghi rõ thêm thông tin nếu cần..."
        ></textarea>

        <button type="submit">Gửi yêu cầu đặt lịch</button>
      </form>
    </section>

    <script>
      // Danh sách 63 tỉnh thành VN
      const provinces = [
        "An Giang",
        "Bà Rịa - Vũng Tàu",
        "Bạc Liêu",
        "Bắc Giang",
        "Bắc Kạn",
        "Bắc Ninh",
        "Bến Tre",
        "Bình Dương",
        "Bình Định",
        "Bình Phước",
        "Bình Thuận",
        "Cà Mau",
        "Cao Bằng",
        "Cần Thơ",
        "Đà Nẵng",
        "Đắk Lắk",
        "Đắk Nông",
        "Điện Biên",
        "Đồng Nai",
        "Đồng Tháp",
        "Gia Lai",
        "Hà Giang",
        "Hà Nam",
        "Hà Nội",
        "Hà Tĩnh",
        "Hải Dương",
        "Hải Phòng",
        "Hậu Giang",
        "Hòa Bình",
        "Hưng Yên",
        "Khánh Hòa",
        "Kiên Giang",
        "Kon Tum",
        "Lai Châu",
        "Lạng Sơn",
        "Lào Cai",
        "Lâm Đồng",
        "Long An",
        "Nam Định",
        "Nghệ An",
        "Ninh Bình",
        "Ninh Thuận",
        "Phú Thọ",
        "Phú Yên",
        "Quảng Bình",
        "Quảng Nam",
        "Quảng Ngãi",
        "Quảng Ninh",
        "Quảng Trị",
        "Sóc Trăng",
        "Sơn La",
        "Tây Ninh",
        "Thái Bình",
        "Thái Nguyên",
        "Thanh Hóa",
        "Thừa Thiên Huế",
        "Tiền Giang",
        "TP. Hồ Chí Minh",
        "Trà Vinh",
        "Tuyên Quang",
        "Vĩnh Long",
        "Vĩnh Phúc",
        "Yên Bái",
      ];

      const citySelect = document.getElementById("city");
      provinces.forEach((province) => {
        const option = document.createElement("option");
        option.value = province;
        option.textContent = province;
        citySelect.appendChild(option);
      });

      // Xử lý lưu đơn đặt vào LocalStorage
      document
        .getElementById("bookingForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const booking = {
            service: document.getElementById("service").value,
            date: document.getElementById("date").value,
            time: document.getElementById("time").value,
            city: document.getElementById("city").value,
            note: document.getElementById("note").value,
          };

          // Lưu vào localStorage
          const bookings = JSON.parse(localStorage.getItem("bookings") || "[]");
          bookings.push(booking);
          localStorage.setItem("bookings", JSON.stringify(bookings));

          alert("✅ Đặt lịch thành công!");
          this.reset();
        });
    </script>
  </body>
</html>
